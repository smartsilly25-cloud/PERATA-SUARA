name: Build Perata Suara (Windows)

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Pasang Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Pasang dependensi
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build aplikasi .exe
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --noconsole `
            --name PerataSuara `
            --icon assets/icon.ico `
            --add-data "assets;assets" `
            --collect-all imageio_ffmpeg `
            app.py

      - name: Siapkan paket rilis
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release/PerataSuara | Out-Null
          Copy-Item dist/PerataSuara.exe release/PerataSuara/
          Compress-Archive -Path release/PerataSuara -DestinationPath PerataSuara-Windows.zip -Force

      - name: Unggah hasil build
        uses: actions/upload-artifact@v4
        with:
          name: PerataSuara-Windows
          path: PerataSuara-Windows.zip

      - name: Buat GitHub Release (khusus tag v*)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: PerataSuara-Windows.zip
