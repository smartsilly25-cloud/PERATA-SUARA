name: Build Perata Suara (Windows)

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Pasang Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Siapkan proyek (ekstrak file .zip otomatis bila perlu)
        shell: pwsh
        run: |
          $ws = $env:GITHUB_WORKSPACE
          function Find-App {
            Get-ChildItem -Path $ws -Recurse -File -Filter app.py |
              Where-Object { Test-Path (Join-Path $_.DirectoryName 'core.py') } |
              Select-Object -First 1
          }
          $app = Find-App
          if (-not $app) {
            $zips = Get-ChildItem -Path $ws -Recurse -File -Filter *.zip
            foreach ($z in $zips) {
              $dest = Join-Path $ws ("_src_" + [IO.Path]::GetFileNameWithoutExtension($z.Name))
              Write-Host "Mengekstrak $($z.Name) ke $dest"
              Expand-Archive -Path $z.FullName -DestinationPath $dest -Force
            }
            $app = Find-App
          }
          if (-not $app) {
            Write-Host "Isi repo:"
            Get-ChildItem -Path $ws -Recurse -File | ForEach-Object { $_.FullName.Replace($ws, '') }
            Write-Error "app.py dan core.py tidak ditemukan. Upload file PerataSuara-GitHub.zip ke repo."
            exit 1
          }
          Write-Host "Folder proyek: $($app.DirectoryName)"
          "PROJECT_DIR=$($app.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Pasang dependensi
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install imageio-ffmpeg Pillow pyinstaller

      - name: Build aplikasi .exe
        shell: pwsh
        run: |
          Set-Location $env:PROJECT_DIR
          $pyArgs = @("--noconfirm", "--clean", "--onefile", "--noconsole", "--name", "PerataSuara", "--collect-all", "imageio_ffmpeg")
          if (Test-Path "assets/icon.ico") { $pyArgs += @("--icon", "assets/icon.ico") }
          if (Test-Path "assets") { $pyArgs += @("--add-data", "assets;assets") }
          $pyArgs += "app.py"
          pyinstaller @pyArgs
          if (-not (Test-Path "dist/PerataSuara.exe")) { Write-Error "Build gagal: PerataSuara.exe tidak terbentuk."; exit 1 }

      - name: Siapkan paket hasil
        shell: pwsh
        run: |
          $rel = Join-Path $env:GITHUB_WORKSPACE "release/PerataSuara"
          New-Item -ItemType Directory -Force -Path $rel | Out-Null
          Copy-Item (Join-Path $env:PROJECT_DIR "dist/PerataSuara.exe") $rel
          Compress-Archive -Path $rel -DestinationPath (Join-Path $env:GITHUB_WORKSPACE "PerataSuara-Windows.zip") -Force

      - name: Unggah hasil build
        uses: actions/upload-artifact@v4
        with:
          name: PerataSuara-Windows
          path: PerataSuara-Windows.zip

      - name: Buat GitHub Release (khusus tag v*)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: PerataSuara-Windows.zip
